[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transition-helper"
version = "0.1.0"
description = "AI-assisted triage of packages stuck in an Ubuntu transition"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "launchpadlib>=1.11",
    "python-debian>=0.1.49",
    "PyYAML>=6.0",
    "jsonschema>=4.0",
    "requests>=2.28",
    "litellm>=1.40",
    # litellm (1.106.4) imports its MCP handler whenever tools are passed
    "mcp",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
th = "transition_helper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
transition_helper = ["kb_seed/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
